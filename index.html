<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons for modern UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card">
        <h1 class="app-title">Weather App</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." spellcheck="false">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="error-msg" id="error-msg">City not found. Please try again!</div>

        <!-- Weather info remains hidden initially to avoid broken images -->
        <div class="weather-info" id="weather-info" style="display: none;">
            <h2 class="city-name" id="city-name">--</h2>
            <img src="" alt="Weather Icon" class="weather-icon" id="weather-icon">
            <h1 class="temp" id="temp">--°C</h1>
            <p class="description" id="description">--</p>

            <div class="details">
                <div class="col">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <p class="humidity" id="humidity">--%</p>
                        <p class="label">Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p class="wind" id="wind">-- km/h</p>
                        <p class="label">Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
